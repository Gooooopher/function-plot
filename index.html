<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1e1e1e">
<title>函数绘图器</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "PingFang SC", Helvetica, Arial, sans-serif;
    background: #1e1e1e; color: #eee; overflow: hidden;
  }
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; padding: 10px 14px;
    background: rgba(30,30,30,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid #333; display: flex; flex-wrap: wrap;
    gap: 8px; align-items: center; z-index: 10;
  }
  #toolbar label { font-size: 13px; color: #aaa; }
  #expr {
    flex: 1; min-width: 260px; padding: 8px 12px; font-size: 15px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    background: #2a2a2a; border: 1px solid #444; color: #eee;
    border-radius: 6px; outline: none;
  }
  #expr:focus { border-color: #4a9eff; }
  .pill {
    padding: 6px 10px; font-size: 12px; background: #2a2a2a;
    border: 1px solid #444; color: #ddd; border-radius: 6px;
    cursor: pointer; user-select: none;
  }
  .pill:hover { background: #383838; }
  .swatch {
    display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    vertical-align: middle; margin-right: 6px;
  }
  #msg { font-size: 12px; color: #ff7a7a; margin-left: 8px; min-height: 16px; }
  #hint {
    position: fixed; bottom: 10px; left: 14px; font-size: 11px; color: #777;
    pointer-events: none; max-width: calc(100vw - 140px);
  }
  #coord {
    position: fixed; bottom: 10px; right: 14px; font-size: 12px; color: #aaa;
    background: rgba(30,30,30,.7); padding: 4px 8px; border-radius: 4px;
    font-family: "SF Mono", Menlo, monospace; pointer-events: none;
  }
  canvas { display: block; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  #funcList {
    position: fixed; top: 60px; left: 0; right: 0; padding: 8px 14px;
    background: rgba(30,30,30,.85); border-bottom: 1px solid #333;
    display: flex; gap: 6px; flex-wrap: wrap; z-index: 9;
  }
  .funcRow { display: flex; gap: 4px; align-items: center; }
  .funcRow input[type=text] {
    width: 180px; padding: 4px 8px; font-size: 13px;
    background: #2a2a2a; border: 1px solid #444; color: #eee;
    border-radius: 4px; font-family: "SF Mono", Menlo, monospace; outline: none;
  }
  .funcRow input[type=text]:focus { border-color: #4a9eff; }
  .funcRow .del { color: #888; cursor: pointer; padding: 0 4px; }
  .funcRow .del:hover { color: #ff7a7a; }
</style>
</head>
<body>

<div id="toolbar">
  <label>y =</label>
  <input id="expr" placeholder="例如  2*x + 3   或   sin(x) + 0.5*x" value="2*x + 3" spellcheck="false">
  <button class="pill" id="addBtn">+ 添加曲线</button>
  <button class="pill" id="resetBtn">重置视图</button>
  <button class="pill" id="saveBtn">保存 PNG</button>
  <span id="msg"></span>
</div>

<div id="funcList"></div>

<canvas id="cv"></canvas>

<div id="hint">电脑: 拖动平移 · 滚轮缩放 · 双击重置 &nbsp;|&nbsp; 手机: 单指拖动 · 双指捏合缩放 · 双击重置</div>
<div id="coord">x=0  y=0</div>

<script>
// ===================== 表达式解析器 =====================
function makeParser(src) {
  let pos = 0, s = src;
  function skip(){ while(pos<s.length && /\s/.test(s[pos])) pos++; }
  function peek(){ skip(); return s[pos] || ''; }
  function eat(c){ skip(); if(s[pos]===c){ pos++; return true; } return false; }

  function expr(){
    let a = term();
    while(true){
      const c = peek();
      if(c==='+' || c==='-'){ pos++; const b = term(); a = c==='+' ? add(a,b) : sub(a,b); }
      else break;
    }
    return a;
  }
  function term(){
    let a = factor();
    while(true){
      const c = peek();
      if(c==='*' || c==='/'){ pos++; const b = factor(); a = c==='*' ? mul(a,b) : div(a,b); }
      else break;
    }
    return a;
  }
  function factor(){
    const a = unary();
    if(peek()==='^'){ pos++; const b = factor(); return (x)=>Math.pow(a(x), b(x)); }
    return a;
  }
  function unary(){
    const c = peek();
    if(c==='+'){ pos++; return unary(); }
    if(c==='-'){ pos++; const u = unary(); return (x)=>-u(x); }
    return primary();
  }
  function primary(){
    skip();
    if(pos>=s.length) throw new Error("意外结尾");
    const c = s[pos];
    if(c==='('){ pos++; const e = expr(); if(!eat(')')) throw new Error("缺少 )"); return e; }
    if(/[0-9.]/.test(c)){
      let start = pos;
      while(pos<s.length && /[0-9.]/.test(s[pos])) pos++;
      if(s[pos]==='e'||s[pos]==='E'){ pos++; if(s[pos]==='+'||s[pos]==='-') pos++; while(pos<s.length && /[0-9]/.test(s[pos])) pos++; }
      const v = parseFloat(s.substring(start, pos));
      return ()=>v;
    }
    if(/[a-zA-Z_]/.test(c)){
      let start = pos;
      while(pos<s.length && /[a-zA-Z0-9_]/.test(s[pos])) pos++;
      const name = s.substring(start, pos);
      skip();
      if(s[pos]==='('){
        pos++; const a = expr();
        if(!eat(')')) throw new Error("函数 "+name+" 缺少 )");
        return makeFunc(name, a);
      } else {
        if(name==='x'||name==='X') return (x)=>x;
        if(name==='pi'||name==='PI'||name==='Pi') return ()=>Math.PI;
        if(name==='e'||name==='E') return ()=>Math.E;
        throw new Error("未知标识符: "+name);
      }
    }
    throw new Error("意外字符: "+c);
  }
  const add=(a,b)=>x=>a(x)+b(x), sub=(a,b)=>x=>a(x)-b(x);
  const mul=(a,b)=>x=>a(x)*b(x), div=(a,b)=>x=>a(x)/b(x);
  function makeFunc(name, a){
    const m = {
      sin: Math.sin, cos: Math.cos, tan: Math.tan,
      asin: Math.asin, acos: Math.acos, atan: Math.atan,
      sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
      exp: Math.exp, log: Math.log, ln: Math.log,
      log10: Math.log10, log2: Math.log2,
      sqrt: Math.sqrt, abs: Math.abs, floor: Math.floor, ceil: Math.ceil,
      round: Math.round, sign: Math.sign,
    };
    if(!m[name]) throw new Error("未知函数: "+name);
    return (x)=>m[name](a(x));
  }
  return { parse(){ const e = expr(); skip(); if(pos!==s.length) throw new Error("多余内容: "+s.substring(pos)); return e; } };
}

// ===================== 视图与绘制 =====================
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const dpr = window.devicePixelRatio || 1;

let view = { cx: 0, cy: 0, scale: 40 }; // scale = 像素/单位
let W = 0, H = 0;

const palette = ['#4a9eff', '#ff7a7a', '#7bd88f', '#f7b955', '#c792ea', '#fcd0a1'];
let curves = [{ text: '2*x + 3', color: palette[0], fn: null, err: '' }];

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
window.addEventListener('resize', resize);

function px(x){ return W/2 + (x - view.cx) * view.scale; }
function py(y){ return H/2 - (y - view.cy) * view.scale; }
function ux(p){ return view.cx + (p - W/2) / view.scale; }
function uy(p){ return view.cy - (p - H/2) / view.scale; }

function niceStep(range, target) {
  const raw = range / target;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  let nice;
  if (n < 1.5) nice = 1; else if (n < 3) nice = 2; else if (n < 7) nice = 5; else nice = 10;
  return nice * mag;
}

function fmt(v) {
  if (Math.abs(v) < 1e-9) return '0';
  const abs = Math.abs(v);
  if (abs >= 1e5 || abs < 1e-3) return v.toExponential(1);
  return parseFloat(v.toFixed(6)).toString();
}

function draw() {
  ctx.fillStyle = '#1e1e1e';
  ctx.fillRect(0, 0, W, H);

  const xmin = ux(0), xmax = ux(W), ymin = uy(H), ymax = uy(0);
  const xstep = niceStep(xmax - xmin, 10);
  const ystep = niceStep(ymax - ymin, 10);

  // 次网格
  ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = Math.ceil(xmin/xstep)*xstep; x <= xmax; x += xstep) {
    const X = px(x); ctx.moveTo(X, 0); ctx.lineTo(X, H);
  }
  for (let y = Math.ceil(ymin/ystep)*ystep; y <= ymax; y += ystep) {
    const Y = py(y); ctx.moveTo(0, Y); ctx.lineTo(W, Y);
  }
  ctx.stroke();

  // 坐标轴
  ctx.strokeStyle = '#888'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  const Y0 = py(0), X0 = px(0);
  if (Y0 >= 0 && Y0 <= H) { ctx.moveTo(0, Y0); ctx.lineTo(W, Y0); }
  if (X0 >= 0 && X0 <= W) { ctx.moveTo(X0, 0); ctx.lineTo(X0, H); }
  ctx.stroke();

  // 刻度数字
  ctx.fillStyle = '#aaa'; ctx.font = '11px -apple-system, Menlo, monospace';
  ctx.textBaseline = 'top';
  for (let x = Math.ceil(xmin/xstep)*xstep; x <= xmax; x += xstep) {
    if (Math.abs(x) < xstep*0.01) continue;
    const X = px(x);
    const Y = Math.min(Math.max(Y0 + 4, 4), H - 14);
    ctx.textAlign = 'center';
    ctx.fillText(fmt(x), X, Y);
  }
  ctx.textBaseline = 'middle';
  for (let y = Math.ceil(ymin/ystep)*ystep; y <= ymax; y += ystep) {
    if (Math.abs(y) < ystep*0.01) continue;
    const Y = py(y);
    const X = Math.min(Math.max(X0 - 6, 4), W - 4);
    ctx.textAlign = X0 > 4 && X0 < W ? 'right' : 'left';
    ctx.fillText(fmt(y), X, Y);
  }
  if (X0 > 0 && X0 < W && Y0 > 0 && Y0 < H) {
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText('0', X0 - 6, Y0 + 4);
  }

  // 曲线
  const samples = Math.max(W * 2, 800);
  for (const cur of curves) {
    if (!cur.fn) continue;
    ctx.strokeStyle = cur.color; ctx.lineWidth = 2;
    ctx.beginPath();
    let penUp = true, prevY = 0;
    const visH = ymax - ymin;
    for (let i = 0; i <= samples; i++) {
      const x = xmin + (xmax - xmin) * i / samples;
      let y;
      try { y = cur.fn(x); } catch { penUp = true; continue; }
      if (!isFinite(y)) { penUp = true; continue; }
      // 跳变 / 远出视野时抬笔
      if (y < ymin - visH*2 || y > ymax + visH*2) { penUp = true; prevY = y; continue; }
      if (!penUp && Math.abs(y - prevY) > visH) { penUp = true; }
      const X = px(x), Y = py(y);
      if (penUp) { ctx.moveTo(X, Y); penUp = false; } else { ctx.lineTo(X, Y); }
      prevY = y;
    }
    ctx.stroke();
  }
}

// ===================== 交互 =====================
let dragging = false, lastX = 0, lastY = 0;
cv.addEventListener('mousedown', (e)=>{
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  cv.classList.add('dragging');
});
window.addEventListener('mouseup', ()=>{ dragging = false; cv.classList.remove('dragging'); });
window.addEventListener('mousemove', (e)=>{
  const coord = document.getElementById('coord');
  coord.textContent = `x=${fmt(ux(e.clientX))}  y=${fmt(uy(e.clientY))}`;
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  view.cx -= dx / view.scale;
  view.cy += dy / view.scale;
  draw();
});

cv.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0015);
  // 以鼠标位置为缩放中心
  const ax = ux(e.clientX), ay = uy(e.clientY);
  if (e.shiftKey) {
    // 仅缩放 X(用 scaleX/scaleY 不太好,这里用整体 scale 模拟时锚定 x 即可)
    view.scale *= factor;
  } else if (e.altKey) {
    view.scale *= factor;
  } else {
    view.scale *= factor;
  }
  // 保持鼠标下的点不动
  view.cx = ax - (e.clientX - W/2) / view.scale;
  view.cy = ay + (e.clientY - H/2) / view.scale;
  draw();
}, { passive: false });

cv.addEventListener('dblclick', resetView);

// ----- 触摸支持: 单指拖动平移, 双指捏合缩放, 双击重置 -----
let touchState = null;
function touchDistance(t1, t2) {
  const dx = t1.clientX - t2.clientX, dy = t1.clientY - t2.clientY;
  return Math.hypot(dx, dy);
}
function touchMidpoint(t1, t2) {
  return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
}

let lastTapTime = 0;
cv.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const t = e.touches[0];
    touchState = { mode: 'pan', x: t.clientX, y: t.clientY };
    // 双击检测
    const now = Date.now();
    if (now - lastTapTime < 300) { resetView(); lastTapTime = 0; }
    else lastTapTime = now;
  } else if (e.touches.length === 2) {
    const [t1, t2] = e.touches;
    const mid = touchMidpoint(t1, t2);
    touchState = {
      mode: 'pinch',
      dist: touchDistance(t1, t2),
      mx: mid.x, my: mid.y,
      // 锚定中点对应的数学坐标
      anchorX: ux(mid.x), anchorY: uy(mid.y),
    };
  }
}, { passive: false });

cv.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!touchState) return;
  if (touchState.mode === 'pan' && e.touches.length === 1) {
    const t = e.touches[0];
    const dx = t.clientX - touchState.x, dy = t.clientY - touchState.y;
    touchState.x = t.clientX; touchState.y = t.clientY;
    view.cx -= dx / view.scale;
    view.cy += dy / view.scale;
    draw();
  } else if (touchState.mode === 'pinch' && e.touches.length === 2) {
    const [t1, t2] = e.touches;
    const newDist = touchDistance(t1, t2);
    const mid = touchMidpoint(t1, t2);
    const factor = newDist / touchState.dist;
    view.scale *= factor;
    // 保持中点下的数学坐标不动 + 跟随手指中点的位移
    view.cx = touchState.anchorX - (mid.x - W/2) / view.scale;
    view.cy = touchState.anchorY + (mid.y - H/2) / view.scale;
    touchState.dist = newDist;
    touchState.mx = mid.x; touchState.my = mid.y;
    touchState.anchorX = ux(mid.x); touchState.anchorY = uy(mid.y);
    draw();
  }
}, { passive: false });

cv.addEventListener('touchend', (e) => {
  if (e.touches.length === 0) touchState = null;
  else if (e.touches.length === 1) {
    const t = e.touches[0];
    touchState = { mode: 'pan', x: t.clientX, y: t.clientY };
  }
}, { passive: false });

cv.addEventListener('touchcancel', () => { touchState = null; });

function resetView() {
  view = { cx: 0, cy: 0, scale: 40 };
  draw();
}

// ===================== 表达式输入 =====================
const exprInput = document.getElementById('expr');
const msg = document.getElementById('msg');

function recompile(idx) {
  const cur = curves[idx];
  cur.err = '';
  try {
    cur.fn = makeParser(cur.text).parse();
  } catch (e) {
    cur.fn = null;
    cur.err = e.message;
  }
}

function refreshFuncList() {
  const list = document.getElementById('funcList');
  list.innerHTML = '';
  curves.forEach((cur, i) => {
    const row = document.createElement('div'); row.className = 'funcRow';
    row.innerHTML = `
      <span class="swatch" style="background:${cur.color}"></span>
      <label style="color:#888;font-size:12px">y =</label>
      <input type="text" value="${cur.text.replace(/"/g,'&quot;')}" spellcheck="false">
      ${curves.length > 1 ? '<span class="del">✕</span>' : ''}
    `;
    const input = row.querySelector('input');
    input.addEventListener('input', () => {
      cur.text = input.value;
      recompile(i);
      msg.textContent = cur.err ? `[第 ${i+1} 条] ${cur.err}` : '';
      input.style.borderColor = cur.err ? '#ff7a7a' : '#444';
      draw();
    });
    const del = row.querySelector('.del');
    if (del) del.addEventListener('click', () => {
      curves.splice(i, 1); refreshFuncList(); draw();
    });
    list.appendChild(row);
  });
  // 同步主输入框给第一条
  if (curves[0]) exprInput.value = curves[0].text;
}

exprInput.addEventListener('input', () => {
  curves[0].text = exprInput.value;
  recompile(0);
  msg.textContent = curves[0].err || '';
  exprInput.style.borderColor = curves[0].err ? '#ff7a7a' : '#444';
  // 同步到列表里的第一行
  const firstRow = document.querySelector('#funcList .funcRow input[type=text]');
  if (firstRow) firstRow.value = curves[0].text;
  draw();
});

document.getElementById('addBtn').addEventListener('click', () => {
  const color = palette[curves.length % palette.length];
  curves.push({ text: 'x', color, fn: null, err: '' });
  recompile(curves.length - 1);
  refreshFuncList();
  draw();
});

document.getElementById('resetBtn').addEventListener('click', resetView);

document.getElementById('saveBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'plot.png';
  link.href = cv.toDataURL('image/png');
  link.click();
});

// 初始化
recompile(0);
refreshFuncList();
resize();
</script>

</body>
</html>
